databases:
  - name: aitasa-db
    plan: free
    databaseName: aitasa_db
    user: aitasa

services:
  - type: web
    name: aitasa-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aitasa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  - type: web
    name: aitasa-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Render no permite componer una URL completa aquí automáticamente.
      # Después del primer deploy, edita este valor en el dashboard de Render
      # con la URL real del backend, p.ej. https://aitasa-backend.onrender.com/api
      - key: VITE_API_URL
        value: https://aitasa-backend.onrender.com/api
