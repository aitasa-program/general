databases:
  - name: aitasa-db
    plan: free
    databaseName: aitasa_db
    user: aitasa

services:
  - type: web
    name: aitasa-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aitasa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Variables per a "Modificacions APP" (IA que proposa canvis de codi, només encarregats).
      # Sense aquestes variables la pestanya mostra un avís i no deixa demanar canvis.
      - key: IA_ANTHROPIC_API_KEY
        sync: false
      # Fine-grained personal access token amb permisos "Contents: Read and write"
      # i "Pull requests: Read and write" limitats NOMÉS a aquest repositori.
      - key: IA_GITHUB_TOKEN
        sync: false
      # Format "propietari/repositori", p.ex. aitasa-program/general
      - key: IA_GITHUB_REPO
        sync: false
      # Branca on es fan els commits (per defecte "main" si no es posa).
      - key: IA_GITHUB_BRANCH
        sync: false

  - type: web
    name: aitasa-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Render no permite componer una URL completa aquí automáticamente.
      # Después del primer deploy, edita este valor en el dashboard de Render
      # con la URL real del backend, p.ej. https://aitasa-backend.onrender.com/api
      - key: VITE_API_URL
        value: https://aitasa-backend.onrender.com/api
